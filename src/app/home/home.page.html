<ion-header>
  <ion-toolbar>
    <ion-title>Página de Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="autenticarUsuario()">
    <ion-item>
      <ion-label position="floating">Usuário</ion-label>
      <ion-input
        type="text"
        [(ngModel)]="instancia.username"
        name="username"
        required>
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Senha</ion-label>
      <ion-input
        type="password"
        [(ngModel)]="instancia.password"
        name="password"
        required>
      </ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" style="color: white;">
      Entrar
    </ion-button>
  </form>
</ion-content>
